# VPP Nginx Reverse Proxy Configuration
# Routes: React frontend, PocketBase API, HyperFrames preview, Orchestrator API
#
# Usage:
#   Local dev:  symlink or copy to /etc/nginx/sites-available/vpp.conf
#   VPS deploy: included in scripts/deploy.sh

server {
    listen 80;
    server_name _;  # Replace with your domain on VPS

    # React frontend (Vite dev server / built static files)
    location / {
        proxy_pass http://localhost:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support for Vite HMR
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # PocketBase API
    location /api/ {
        proxy_pass http://localhost:8090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HyperFrames Preview Server
    # Proxied with WebSocket support for hot-reload
    location /preview/ {
        proxy_pass http://localhost:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support for preview hot-reload
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Longer timeout for preview rendering
        proxy_read_timeout 300s;
    }

    # Orchestrator API
    location /orchestrator/ {
        # Strip the /orchestrator prefix before forwarding
        rewrite ^/orchestrator/(.*) /$1 break;
        proxy_pass http://localhost:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for AI operations (research, script gen, feedback)
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Static compositions (served directly for preview iframe src)
    location /compositions/ {
        alias /Users/markb/dev/vpp/compositions/;
        autoindex off;
        # Allow iframe embedding
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
